<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONG Mãos Solidárias</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Skip link: permite que usuários de teclado pulem direto para o
         conteúdo principal, sem precisar tabular por todo o menu a cada
         página (WCAG 2.4.1 - Bypass Blocks) -->
    <a href="#app" class="skip-link">Pular para o conteúdo principal</a>

    <header>
        <h1>ONG Mãos Solidárias</h1>

        <button class="hamburger" id="hamburger" type="button"
            aria-label="Abrir menu de navegação" aria-expanded="false" aria-controls="main-nav">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="main-nav" aria-label="Navegação principal">
            <a href="#/" data-route="/">Início</a>

            <div class="dropdown">
                <a href="#/projetos" class="dropdown-toggle" data-route="/projetos"
                    aria-haspopup="true" aria-expanded="false">Projetos</a>
                <ul class="dropdown-menu">
                    <li><a href="#/projetos" data-route="/projetos">Reforço Escolar</a></li>
                    <li><a href="#/projetos" data-route="/projetos">Campanha de Doações</a></li>
                    <li><a href="#/projetos" data-route="/projetos">Programa de Voluntariado</a></li>
                </ul>
            </div>

            <a href="#/cadastro" data-route="/cadastro">Cadastro</a>
        </nav>
    </header>

    <!-- A SPA injeta o template da rota ativa aqui dentro.
         tabindex="-1" permite que o skip link mova o foco para cá
         programaticamente, embora <main> não seja focável por padrão -->
    <main id="app" tabindex="-1">
        <p>Carregando...</p>
    </main>

    <footer>
        <p>&copy; 2026 ONG Mãos Solidárias</p>
    </footer>

    <!-- Toast global (persiste entre trocas de rota) -->
    <div class="toast" id="toast-sucesso" role="status" aria-live="polite" aria-atomic="true">
        <strong>Cadastro enviado!</strong> Em breve entraremos em contato.
    </div>

    <!-- Day.js: biblioteca leve (~2KB) para manipulação e formatação de datas.
         Carregada via CDN, antes do módulo principal, para que window.dayjs
         já exista quando templates.js precisar formatar uma data. -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>

    <script src="js/main.js" type="module"></script>

</body>

</html>
